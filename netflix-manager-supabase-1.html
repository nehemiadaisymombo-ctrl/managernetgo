<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestionnaire d'abonnements Netflix — avec comptes">
<title>Manager Net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F1F6F3; --surface:#fff; --ink:#16211D; --muted:#6B7770; --line:#E3E9E4;
  --brand:#E50914; --brand-dark:#B00610;
  --teal:#123128; --teal-ink:#E9F3EE;
  --sun:#F3D98B; --sun-ink:#5B3E08;
  --coral:#F6D3C7; --coral-ink:#7A2A16;
  --mint:#DCEFE3; --mint-ink:#175C3D;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%;}
html,body{height:100%;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5;}
button,input{font:inherit; -webkit-tap-highlight-color:transparent;}
input{-webkit-appearance:none; appearance:none;}
.app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--bg);}
.header{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.hgroup .eyebrow{font-size:12px; font-weight:600; color:var(--brand); letter-spacing:.03em;}
.hgroup h1{font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1;}
.hright{display:flex; align-items:center; gap:10px;}
.who{display:flex; align-items:center; gap:8px;}
.who-avatar{width:34px; height:34px; border-radius:50%; background:var(--teal); color:var(--teal-ink); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;}
.who-role{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;}
.icon-btn{width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink); position:relative;}
.icon-btn:active{transform:scale(.92);}
.bell-btn.ring svg{animation:ring .5s ease;}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.badge{position:absolute; top:-3px; right:-3px; min-width:19px; height:19px; padding:0 4px; border-radius:10px; background:var(--brand); color:#fff; font-size:11px; font-weight:700; display:none; align-items:center; justify-content:center;}
.content{flex:1; padding:0 20px calc(96px + env(safe-area-inset-bottom,0px)); overflow-y:auto;}
.page{display:none;}
.page.active{display:block; animation:rise .38s cubic-bezier(.2,.8,.3,1);}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:translateY(0)}}
.center{padding:50px 22px; text-align:center;}
.center .circ{width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.center h2{font-family:'Bebas Neue',sans-serif; font-size:26px; margin-bottom:8px;}
.center p{color:var(--muted); font-size:14px; max-width:300px; margin:0 auto;}
.tabs{display:flex; gap:8px; margin-bottom:18px;}
.tab{flex:1; padding:12px; text-align:center; border-radius:11px; font-weight:700; font-size:13.5px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer;}
.tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px;}
.field input{width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); font-size:16px; min-height:48px; color:var(--ink);}
.field input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(229,9,20,.1);}
.err{display:block; color:var(--brand); font-size:12px; margin-top:5px; min-height:14px;}
.btn{width:100%; min-height:50px; border:none; border-radius:13px; font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; transition:transform .12s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:active{background:var(--brand-dark);}
.btn-ghost{background:var(--surface); color:var(--ink); border:1.5px solid var(--line); margin-top:10px;}
.hint{color:var(--muted); font-size:13px; margin:16px 0 18px; display:flex; gap:8px; align-items:flex-start;}
.stats{display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:9px; margin-bottom:18px;}
.stat{border-radius:16px; padding:14px 14px 12px; min-height:92px; display:flex; flex-direction:column; justify-content:space-between;}
.stat .num{font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1;}
.stat .lbl{font-size:11.5px; font-weight:600; opacity:.85;}
.stat.total{background:var(--teal); color:var(--teal-ink);}
.stat.actif{background:var(--sun); color:var(--sun-ink);}
.stat.expire{background:var(--coral); color:var(--coral-ink);}
.search{position:relative; margin-bottom:12px;}
.search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted);}
.search input{padding-left:42px;}
.chips{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:16px;}
.chip{padding:10px 6px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); font-weight:700; font-size:12.5px; cursor:pointer;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.plist{display:flex; flex-direction:column; gap:10px;}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:14px; display:flex; align-items:center; gap:12px;}
.avatar{width:42px; height:42px; border-radius:12px; background:var(--brand); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.pbody{flex:1; min-width:0;}
.pname{font-weight:700; font-size:15px;}
.pmeta{font-size:12.5px; color:var(--muted);}
.pstatus{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
.tag{padding:4px 9px; border-radius:7px; font-size:11px; font-weight:700; white-space:nowrap;}
.tag.actif{background:var(--mint); color:var(--mint-ink);}
.tag.bientot{background:var(--sun); color:var(--sun-ink);}
.tag.expire{background:var(--coral); color:var(--coral-ink);}
.del-btn{width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.del-btn:active{background:var(--coral); color:var(--coral-ink); border-color:var(--coral);}
.empty{text-align:center; padding:50px 20px; color:var(--muted);}
.empty p:first-of-type{font-weight:600; color:var(--ink); margin-bottom:4px;}
.nav{position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--surface); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; z-index:50;}
.nav button{flex:1; min-height:48px; border-radius:12px; border:none; font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;}
.nav .active{background:var(--brand); color:#fff;}
.nav .inactive{background:var(--bg); color:var(--ink);}
.toasts{position:fixed; top:0; left:0; right:0; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px; z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
.toast{max-width:480px; margin:0 auto; width:100%; padding:13px 16px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.12); animation:slidedown .3s ease-out; pointer-events:all;}
.toast.hide{animation:slideup .25s ease-in forwards;}
@keyframes slidedown{from{opacity:0; transform:translateY(-16px)}to{opacity:1; transform:translateY(0)}}
@keyframes slideup{to{opacity:0; transform:translateY(-16px)}}
.toast.success{background:var(--mint); color:var(--mint-ink);}
.toast.danger{background:var(--coral); color:var(--coral-ink);}
.toast.info{background:#DCE7F6; color:#1E3A6B;}
.overlay{position:fixed; inset:0; background:rgba(15,20,17,.5); z-index:300; display:flex; align-items:flex-end;}
.modal{width:100%; max-width:480px; margin:0 auto; background:var(--surface); border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px)); max-height:78vh; overflow-y:auto;}
.modal h2{font-size:17px; margin-bottom:14px;}
.pend{padding:12px; border-radius:12px; background:var(--bg); margin-bottom:8px; display:flex; align-items:center; justify-content:between; gap:10px;}
.pend .em{flex:1; font-size:13.5px; font-weight:600;}
.pend button{padding:9px 14px; border:none; border-radius:9px; background:var(--brand); color:#fff; font-weight:700; font-size:12.5px; cursor:pointer;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions button{flex:1; min-height:46px; border:none; border-radius:11px; font-weight:700; font-size:14px; cursor:pointer;}
.m-cancel{background:var(--bg); color:var(--ink);}
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>
<div class="app">
  <div class="header">
    <div class="hgroup"><div class="eyebrow">Manager Net</div><h1 id="greeting">Vos profils</h1></div>
    <div class="hright" id="hright"></div>
  </div>
  <div class="content">
    <div class="page active" id="page-auth">
      <div class="tabs"><button class="tab active" data-t="in">Connexion</button><button class="tab" data-t="up">Inscription</button></div>
      <div class="field"><label>Adresse e-mail</label><input type="email" id="authEmail" autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="authPass" autocomplete="current-password"></div>
      <span class="err" id="authErr"></span>
      <button class="btn btn-primary" id="authBtn"><span>Se connecter</span></button>
      <p style="text-align:center; color:var(--muted); font-size:12.5px; margin-top:14px;">Le premier compte créé devient automatiquement administrateur général.</p>
    </div>
    <div class="page" id="page-pending"><div class="center" id="pendingBox"></div></div>
    <div class="page" id="page-home">
      <div class="center"><div class="circ" id="homeIcon" style="background:var(--teal); color:var(--teal-ink)"></div><h2>Bienvenue</h2><p>Suivez vos profils Netflix, leurs dates et leur statut.</p>
      <button class="btn btn-primary" id="enterBtn" style="margin-top:22px;"><span>Accéder au gestionnaire</span></button></div>
    </div>
    <div class="page" id="page-add">
      <div class="stats" id="stats"></div>
      <div class="field"><label>Nom du profil</label><input type="text" id="inNom" placeholder="Ex : Standard, Premium…"></div>
      <div class="field"><label>Date d'abonnement</label><input type="date" id="inDate"></div>
      <div class="field"><label>Durée (mois)</label><input type="number" id="inMois" min="1" max="12" value="3"></div>
      <button class="btn btn-primary" id="addBtn"></button>
      <div class="hint" id="hintBox"></div>
    </div>
    <div class="page" id="page-list">
      <div class="search"><div id="searchIcon"></div><input type="search" id="inSearch" placeholder="Rechercher un profil…"></div>
      <div class="chips" id="chips"></div>
      <div id="plist"></div>
    </div>
  </div>
  <div class="nav" id="navBar" style="display:none">
    <button class="active" id="navAdd"></button>
    <button class="inactive" id="navList"></button>
  </div>
</div>
<script>
const ICON = {
  bell:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  grid:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  shield:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  layers:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  search:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  box:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/></svg>',
  info:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
  hourglass:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>',
  users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15.5 14.2c2.6.4 4.5 2.5 4.5 5.8"/></svg>',
  logout:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>'
};
document.getElementById('addBtn').innerHTML = ICON.plus + " <span>Ajouter le profil</span>";
document.getElementById('searchIcon').innerHTML = ICON.search;
document.getElementById('navAdd').innerHTML = ICON.plus + ' Ajouter';
document.getElementById('navList').innerHTML = ICON.grid + ' Mes profils';
document.getElementById('hintBox').innerHTML = ICON.info + ' <span>Vous serez averti quand un profil approche de sa date d\'expiration.</span>';
document.getElementById('homeIcon').innerHTML = ICON.layers;
document.getElementById('authBtn').innerHTML = '<span>Se connecter</span>';

/* ===== Supabase ===== */
const sb = window.supabase.createClient(
  'https://ubwuiathyytwrnrmohht.supabase.co',
  'sb_publishable_afM9YTrKTZS0NwSRzWiT-A_r2wsHYeC'
);

let session=null, myProfile=null, authMode='in';
let abos=[], notifs=[], filtre='tous', recherche='';

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function toast(msg,type='info'){
  const c = document.getElementById('toasts'); const el = document.createElement('div');
  el.className = `toast ${type}`; el.textContent = msg; c.appendChild(el);
  setTimeout(()=>{ el.classList.add('hide'); setTimeout(()=>el.remove(),250); }, 3200);
}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===== Auth UI ===== */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); authMode=t.dataset.t;
  document.getElementById('authBtn').querySelector('span').textContent = authMode==='in' ? 'Se connecter' : "S'inscrire";
}));
document.getElementById('authBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr'); err.textContent='';
  if(!email || !pass){ err.textContent='Entrez un e-mail et un mot de passe'; return; }
  if(pass.length<6){ err.textContent='Le mot de passe doit faire au moins 6 caractères'; return; }
  try{
    if(authMode==='up'){
      const {error} = await sb.auth.signUp({email, password:pass});
      if(error) throw error;
      toast('Compte créé ! Vérifiez vos e-mails si une confirmation est demandée.','success');
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
    }
  }catch(e){ err.textContent = e.message || 'Une erreur est survenue'; }
});

/* ===== Cycle de session ===== */
sb.auth.onAuthStateChange((_evt, s)=>{ session = s; boot(); });

async function boot(){
  if(!session){ showPage('page-auth'); document.getElementById('hright').innerHTML=''; document.getElementById('navBar').style.display='none'; return; }
  const uid = session.user.id;
  let {data, error} = await sb.from('app_profiles').select('*').eq('id', uid).maybeSingle();
  if(!data){ await new Promise(r=>setTimeout(r,600)); ({data} = await sb.from('app_profiles').select('*').eq('id', uid).maybeSingle()); }
  myProfile = data;
  renderHeader();
  if(!myProfile || !myProfile.approved){ showPending(); return; }
  await loadAbos();
  setDefaultDate(); render(); showPage('page-home');
}

function renderHeader(){
  const h = document.getElementById('hright');
  const initial = (session.user.email||'?').charAt(0).toUpperCase();
  const role = myProfile && myProfile.role==='admin' ? 'Admin général' : (myProfile && myProfile.approved ? 'Sous-admin' : 'En attente');
  h.innerHTML = `
    ${myProfile && myProfile.role==='admin' ? `<button class="icon-btn" id="adminBtn">${ICON.users}</button>` : ''}
    <button class="icon-btn bell-btn" id="bellBtn">${ICON.bell}<div class="badge" id="badge">0</div></button>
    <div class="who"><div style="text-align:right"><div class="who-role">${role}</div></div><div class="who-avatar">${initial}</div></div>
    <button class="icon-btn" id="logoutBtn">${ICON.logout}</button>`;
  document.getElementById('bellBtn').addEventListener('click', showNotifModal);
  document.getElementById('logoutBtn').addEventListener('click', ()=>sb.auth.signOut());
  if(myProfile && myProfile.role==='admin') document.getElementById('adminBtn').addEventListener('click', showAdminModal);
}

function showPending(){
  document.getElementById('navBar').style.display='none';
  showPage('page-pending');
  document.getElementById('pendingBox').innerHTML = `<div class="circ" style="background:var(--sun); color:var(--sun-ink)">${ICON.hourglass}</div><h2>Accès en attente</h2><p>Votre compte a été créé. Un administrateur général doit approuver votre accès avant que vous puissiez utiliser Manager Net.</p>`;
}

/* ===== Panneau admin : approbation des sous-admins ===== */
async function showAdminModal(){
  const {data} = await sb.from('app_profiles').select('*').eq('approved', false).order('created_at');
  const pend = data || [];
  const html = `<div class="overlay" id="ov"><div class="modal"><h2>Demandes d'accès</h2>
    ${pend.length===0 ? '<p style="color:var(--muted); font-size:13.5px;">Aucune demande en attente.</p>' :
      pend.map(p=>`<div class="pend"><div class="em">${esc(p.email)}</div><button data-approve="${p.id}">Approuver</button></div>`).join('')}
    <div class="modal-actions"><button class="m-cancel" id="mClose">Fermer</button></div>
  </div></div>`;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('mClose').onclick = closeModal;
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', async ()=>{
    await sb.from('app_profiles').update({approved:true, granted_by:session.user.id}).eq('id', b.dataset.approve);
    toast('Accès approuvé','success'); closeModal();
  }));
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ===== Données (privées par utilisateur, via RLS) ===== */
async function loadAbos(){
  const {data} = await sb.from('app_subscriptions').select('*').eq('user_id', session.user.id).order('created_at');
  abos = (data||[]).map(a=>({id:a.id, nom:a.nom, dateAbonnement:a.date_abonnement, mois:a.mois}));
}
function statut(dateAbo, mois){
  const debut = new Date(dateAbo+'T00:00:00'); const fin = new Date(debut); fin.setMonth(fin.getMonth()+Number(mois));
  const jours = Math.ceil((fin - new Date())/86400000);
  if(jours<0) return {type:'expire', label:'Expiré', jours:0, fin};
  if(jours<=7) return {type:'bientot', label:'Bientôt expiré', jours, fin};
  return {type:'actif', label:'Actif', jours, fin};
}
function render(){
  const total = abos.length; let nActif=0, nExpire=0;
  abos.forEach(a=>{ const s=statut(a.dateAbonnement,a.mois); s.type==='expire' ? nExpire++ : nActif++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat total"><div>${ICON.layers}</div><div><div class="num">${total}</div><div class="lbl">Profils au total</div></div></div>
    <div class="stat actif"><div>${ICON.shield}</div><div><div class="num">${nActif}</div><div class="lbl">Actifs</div></div></div>
    <div class="stat expire"><div>${ICON.clock}</div><div><div class="num">${nExpire}</div><div class="lbl">Expirés</div></div></div>`;
  document.getElementById('chips').innerHTML = ['tous','actif','expire'].map(f=>{
    const label = f==='tous' ? `Tous (${total})` : f==='actif' ? `Actifs (${nActif})` : `Expirés (${nExpire})`;
    return `<button class="chip ${filtre===f?'active':''}" data-f="${f}">${label}</button>`;
  }).join('');
  const rech = recherche.trim().toLowerCase();
  const items = abos.filter(a=>{
    const s = statut(a.dateAbonnement,a.mois);
    const okF = filtre==='tous' || (filtre==='actif' && s.type!=='expire') || (filtre==='expire' && s.type==='expire');
    return okF && (!rech || a.nom.toLowerCase().includes(rech));
  });
  const list = document.getElementById('plist');
  if(abos.length===0){ list.innerHTML = `<div class="empty">${ICON.box}<p>Aucun profil pour l'instant</p><p>Ajoutez votre premier profil Netflix</p></div>`; return; }
  if(items.length===0){ list.innerHTML = `<div class="empty">${ICON.search}<p>Aucun résultat</p><p>Essayez un autre filtre ou nom</p></div>`; return; }
  list.innerHTML = `<div class="plist">` + items.map(a=>{
    const s = statut(a.dateAbonnement,a.mois);
    return `<div class="pcard"><div class="avatar">${esc(a.nom.trim().charAt(0).toUpperCase()||'?')}</div>
      <div class="pbody"><div class="pname">${esc(a.nom)}</div><div class="pmeta">${a.mois} mois · fin le ${s.fin.toLocaleDateString('fr-FR')}</div></div>
      <div class="pstatus"><span class="tag ${s.type}">${s.label}${s.type!=='expire' ? ' · '+s.jours+'j' : ''}</span>
      <button class="del-btn" data-del="${a.id}">${ICON.trash}</button></div></div>`;
  }).join('') + `</div>`;
}
async function ajouter(){
  const nom = document.getElementById('inNom').value.trim();
  const date = document.getElementById('inDate').value;
  const mois = parseInt(document.getElementById('inMois').value,10);
  if(!nom){ toast('Entrez un nom de profil','danger'); return; }
  if(!date){ toast("Choisissez une date d'abonnement",'danger'); return; }
  if(!Number.isInteger(mois) || mois<1 || mois>12){ toast('La durée doit être entre 1 et 12 mois','danger'); return; }
  const {error} = await sb.from('app_subscriptions').insert({user_id:session.user.id, nom, date_abonnement:date, mois});
  if(error){ toast("Erreur : "+error.message,'danger'); return; }
  toast(`Profil « ${nom} » ajouté`,'success');
  document.getElementById('inNom').value=''; document.getElementById('inMois').value='3'; setDefaultDate();
  await loadAbos(); render(); setTimeout(()=>goPage('list'),400);
}
async function supprimer(id){
  const a = abos.find(x=>x.id===id); if(!a) return;
  if(confirm(`Supprimer « ${a.nom} » ?`)){
    await sb.from('app_subscriptions').delete().eq('id', id);
    await loadAbos(); render(); toast(`« ${a.nom} » supprimé`,'success');
  }
}
function setDefaultDate(){
  const n = new Date();
  document.getElementById('inDate').value = new Date(n - n.getTimezoneOffset()*60000).toISOString().split('T')[0];
}
function goPage(p){ document.getElementById('navBar').style.display='flex'; showPage('page-'+p);
  document.getElementById('navAdd').className = p==='add' ? 'active' : 'inactive';
  document.getElementById('navList').className = p==='list' ? 'active' : 'inactive'; render(); }

/* Notifications locales (rappels d'expiration, par appareil) */
function updateBadge(){ const n = notifs.filter(x=>!x.lue).length; const b=document.getElementById('badge'); if(!b) return; if(n>0){ b.textContent=n; b.style.display='flex'; } else b.style.display='none'; }
function showNotifModal(){
  if(notifs.length===0){ toast('Aucune notification','info'); return; }
  notifs.forEach(n=>n.lue=true); updateBadge();
  const html = `<div class="overlay" id="ov"><div class="modal"><h2>Notifications</h2>${notifs.map(n=>`<div class="pend"><div class="em">${esc(n.titre)} — ${esc(n.message)}</div></div>`).join('')}<div class="modal-actions"><button class="m-cancel" id="mClose">Fermer</button></div></div></div>`;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('mClose').onclick = closeModal;
}
function checkExpirations(){
  abos.forEach(a=>{ const s = statut(a.dateAbonnement,a.mois);
    if(s.type==='expire' && s.jours===0) notifs.unshift({titre:'Expiré aujourd\'hui', message:a.nom, lue:false});
    else if(s.jours===1) notifs.unshift({titre:'Expire demain', message:a.nom, lue:false});
  }); updateBadge();
}

document.getElementById('enterBtn').addEventListener('click', ()=>goPage('add'));
document.getElementById('addBtn').addEventListener('click', ajouter);
document.getElementById('navAdd').addEventListener('click', ()=>goPage('add'));
document.getElementById('navList').addEventListener('click', ()=>goPage('list'));
document.getElementById('inSearch').addEventListener('input', e=>{ recherche=e.target.value; render(); });
document.getElementById('chips').addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return; filtre=b.dataset.f; render(); });
document.getElementById('plist').addEventListener('click', e=>{ const b=e.target.closest('[data-del]'); if(!b) return; supprimer(b.dataset.del); });

(async ()=>{ const {data:{session:s}} = await sb.auth.getSession(); session=s; await boot(); })();
</script>
